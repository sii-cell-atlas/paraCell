name: paraCell

channels:
  - conda-forge
  - bioconda

dependencies:
  # Core runtimes
  - python=3.10
  - r-base=4.3.2
  - pip

  # Security remediation
  - curl>=8.4.0
  - libcurl>=8.4.0,<9

  # Core scientific Python packages
  - numpy
  - scipy
  - pandas
  - h5py
  - anndata
  - scanpy
  - python-igraph
  - leidenalg
  - scikit-learn
  - numba
  - matplotlib
  - seaborn
  - statsmodels
  - networkx
  - pyarrow

  # Web application
  - flask
  - flask-cors
  - flask-restful
  - flask-compress
  - gunicorn
  - sqlalchemy

  # Utilities
  - git
  - jq
  - pandoc
  - ipython
  - ipykernel

  # Python packages unavailable or preferably
  # installed through pip
  - pip:
      - cellxgene-gateway
      - anndata2ri
      - batchglm
      - diffxpy
      - fastobo
      - flask-server-timing
      - flask-talisman
      - flatten-dict
      - get-version
      - jupytext
      - legacy-api-wrap
      - s3fs
      - sinfo
      - sparse
      - tiledb
