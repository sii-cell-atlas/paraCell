  - bioconda

dependencies:
  # R runtime - consistent with first environment file
  - r-base=4.3.2

  # Bioconductor
  - bioconductor-rtracklayer
  - bioconductor-fgsea

  # R scientific and visualisation packages
  - r-cairo
  - r-foreign
  - r-ggpubr
